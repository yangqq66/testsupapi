name: Sync Upstream Main To Main

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch main
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main
          git fetch origin main

      - name: Merge upstream main
        run: |
          git checkout -b sync/upstream-main-${{ github.run_number }}
          git merge upstream/main --no-edit --allow-unrelated-histories

      - name: Check whether branch has changes
        id: changes
        run: |
          count=$(git rev-list --count origin/main..HEAD)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No upstream changes to sync."
          fi

      - name: Push sync branch
        if: steps.changes.outputs.count != '0'
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git
          git push origin HEAD:sync/upstream-main-${{ github.run_number }}

      - name: Create pull request to main
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          cat > pr_body.md <<'EOF'
          自动同步开源项目 upstream/main 到当前仓库 main 分支。

          Source: https://github.com/Wei-Shaw/sub2api/tree/main
          Target: main
          EOF

          gh pr create \
            --base main \
            --head sync/upstream-main-${{ github.run_number }} \
            --title "sync: merge upstream main into main" \
            --body-file pr_body.md
